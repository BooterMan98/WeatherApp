name: Build & Test

on:
  pull_request:
    branches: [ testing* ]
    types: [ opened, synchronize]
    paths:
    - '**.cs'
    - '**.csproj'

env:
  DOTNET_VERSION: '10' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Print folder tree
      uses: jaywcjlove/github-action-folder-tree@v1.2.0
      with:
        depth: 2

    - name: Install dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --no-restore --report-xunit-trx --verbosity normal

    - name: Upload Test Results
      if: (!cancelled())
      uses: actions/upload-artifact@v4
      with:
        name: Test Results (OS ${{ matrix.os }})
        path: WeatherAppTests/**/*.trx

  
  publish-tests-results:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      checks: write
    if: (!cancelled())

    steps:
    - name: Download a Build Artifact
      uses: actions/download-artifact@v7.0.0
      with:
        path: artifacts

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: "artifacts/**/*.trx"

